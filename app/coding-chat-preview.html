<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding 对话预览：现在 / 重构</title>
    <style>
      :root {
        --paper: #f4f3ef;
        --ink: #1c1d1f;
        --muted: #5f636c;
        --line: #d8dae0;
        --card: #fff;
        --accent: #2f6fec;
        --ok: #1f7a4d;
        --hold: #a35b10;
        --sans: Inter, "Noto Sans SC", "PingFang SC", sans-serif;
        --mono: ui-monospace, "JetBrains Mono", Menlo, monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100vh; overflow: hidden; }
      body {
        font-family: var(--sans);
        color: var(--ink);
        background: #e8eaee;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      .banner {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.65rem 1rem;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }
      .banner strong { font-size: 0.82rem; }
      .banner p { margin: 0; font-size: 0.75rem; color: var(--muted); }
      .toggle { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
      .toggle button {
        border: 0; background: transparent; padding: 0.32rem 0.85rem;
        font: inherit; font-size: 0.78rem; cursor: pointer; color: var(--muted);
      }
      .toggle button[aria-pressed="true"] { background: var(--ink); color: #fff; }
      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 22rem;
        min-height: 0;
      }
      .dialog {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        min-width: 0;
        min-height: 0;
        background: var(--paper);
      }
      .transcript { overflow: auto; padding: 1.1rem 1.5rem 0.75rem; }
      .col { max-width: 42rem; margin: 0 auto; }
      .inspect {
        min-height: 0;
        overflow: auto;
        border-left: 1px solid var(--line);
        background: #fff;
        padding: 1rem 1.05rem 1.2rem;
        font-size: 0.8rem;
        line-height: 1.5;
      }
      .inspect h2 {
        margin: 0 0 0.35rem;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .inspect h3 { margin: 0.15rem 0 0.45rem; font-size: 0.95rem; }
      .inspect p { margin: 0.45rem 0; }
      .inspect ul { margin: 0.35rem 0 0; padding-left: 1.1rem; }
      .inspect code { font-family: var(--mono); font-size: 0.72rem; background: #f1f2f5; padding: 0.05rem 0.28rem; border-radius: 4px; }
      .region {
        display: block;
        width: 100%;
        border: 1px solid transparent;
        background: transparent;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .region:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .is-on { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 10px; }

      .user {
        margin: 0 0 0.7rem auto;
        max-width: 80%;
        background: #eceff5;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0.65rem 0.8rem;
        font-size: 0.92rem;
        line-height: 1.45;
      }
      .think, .approve, .answer, .compact {
        margin: 0 0 0.55rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        padding: 0.55rem 0.75rem;
      }
      .think summary {
        list-style: none;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.8rem;
        color: var(--muted);
        cursor: pointer;
      }
      .think summary::-webkit-details-marker { display: none; }
      .dot { width: 0.42rem; height: 0.42rem; border-radius: 99px; background: var(--accent); }
      .think ol { margin: 0.45rem 0 0.1rem; padding-left: 1.15rem; color: var(--muted); font-size: 0.8rem; }
      .chips { margin: 0 0 0.55rem; padding: 0.1rem 0; }
      .chip-row { display: flex; align-items: center; gap: 0.45rem; padding: 0.28rem 0.15rem; font-size: 0.8rem; color: var(--muted); }
      .chip-row strong { color: var(--ink); font-weight: 600; }
      .pill {
        display: inline-flex; gap: 0.3rem; align-items: center;
        border: 1px solid var(--line); background: #fff; border-radius: 6px;
        padding: 0.06rem 0.4rem; font-family: var(--mono); font-size: 0.7rem; color: var(--ink);
      }
      .add { color: var(--ok); }
      .del { color: #b42318; }
      .chip-detail { display: none; margin: 0.2rem 0 0.3rem 1.55rem; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); white-space: pre-wrap; }
      .chips.is-open .chip-detail { display: block; }
      .kicker { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--hold); font-weight: 650; }
      .approve h4 { margin: 0.15rem 0 0.35rem; font-size: 0.92rem; }
      .approve p { margin: 0; font-size: 0.8rem; color: var(--muted); }
      .approve pre, .now-pre {
        margin: 0.45rem 0 0;
        padding: 0.45rem 0.55rem;
        background: #f3f4f7;
        border-radius: 6px;
        font-family: var(--mono);
        font-size: 0.75rem;
        overflow: auto;
      }
      .actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.55rem; }
      .actions span {
        border: 1px solid var(--line); background: #fff; border-radius: 999px;
        padding: 0.28rem 0.7rem; font-size: 0.76rem;
      }
      .actions .primary { background: var(--ink); color: #fff; border-color: var(--ink); }
      .answer { font-size: 0.9rem; line-height: 1.5; }
      .answer pre {
        margin: 0.55rem 0;
        padding: 0.65rem 0.7rem;
        background: #111318;
        color: #e8eaef;
        border-radius: 8px;
        font-family: var(--mono);
        font-size: 0.74rem;
        overflow: auto;
      }
      .sources { display: flex; flex-wrap: wrap; gap: 0.3rem; }
      .source { border: 1px solid var(--line); border-radius: 999px; padding: 0.12rem 0.45rem; font-size: 0.72rem; color: var(--muted); }
      .compact { font-size: 0.78rem; color: var(--muted); border-style: dashed; background: #fafaf8; }
      .composer {
        margin: 0 1rem 0.75rem;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 16px;
        padding: 0.5rem 0.7rem 0.45rem;
        box-shadow: 0 8px 24px rgba(20, 24, 32, 0.06);
        max-width: 42rem;
        width: calc(100% - 2rem);
        justify-self: center;
      }
      .composer .input { min-height: 2.3rem; color: var(--muted); font-size: 0.86rem; padding: 0.2rem 0.15rem 0.35rem; }
      .composer .bar { display: flex; align-items: center; gap: 0.35rem; font-size: 0.72rem; color: var(--muted); }
      .token { border: 1px solid var(--line); border-radius: 999px; padding: 0.1rem 0.42rem; background: #f6f7fa; }
      .grow { margin-left: auto; }
      .send { width: 1.55rem; height: 1.55rem; border-radius: 99px; background: var(--accent); }

      body.now .dialog { background: #171a1e; color: #ecece8; }
      body.now .user { background: #2a3138; border-color: #3a424b; color: #f3f1ea; }
      body.now .who { display: block; font-size: 0.62rem; letter-spacing: 0.1em; color: #8b939c; margin-bottom: 0.2rem; }
      body.now .missing { margin: 0 0 0.7rem; font-size: 0.75rem; color: #8b939c; }
      body.now .tool { margin: 0 0 0.7rem; color: #b7bec6; font-size: 0.85rem; }
      body.now .tool summary { cursor: pointer; }
      body.now .notice {
        display: flex; gap: 0.75rem; margin: 0 0 0.7rem;
        border-left: 3px solid #c48a2a; background: #2a2418; padding: 0.75rem 0.8rem;
      }
      body.now .notice .code { font-size: 0.66rem; letter-spacing: 0.08em; color: #e0b15a; font-weight: 700; line-height: 1.2; }
      body.now .bubble { background: #23272c; border-radius: 0.45rem; padding: 0.8rem 0.9rem; margin: 0 0 0.7rem; }
      body.now .composer { background: #22262b; border-color: #3a424b; box-shadow: none; color: #c5c9ce; }
      body.now .token { background: #2c3238; border-color: #3a424b; color: #c5c9ce; }
      body.now .send { background: #05a7dc; }
    </style>
  </head>
  <body>
    <header class="banner">
      <div>
        <strong>设计预览 · 非产品</strong>
        <p>同一轮「改 greet + 跑测试」。重构侧沿用 Beautiful UI 原语接到 Pi 已有事件；现在侧模拟当前成绩单。</p>
      </div>
      <div class="toggle" role="group" aria-label="视图">
        <button type="button" id="btn-now" aria-pressed="false">现在</button>
        <button type="button" id="btn-next" aria-pressed="true">重构</button>
      </div>
    </header>
    <div class="stage">
      <section class="dialog" aria-label="Coding 对话">
        <div class="transcript"><div class="col" id="col"></div></div>
        <div class="composer region" data-key="composer" id="composer">
          <div class="input">描述你想让 MilkSU 完成的任务</div>
          <div class="bar">
            <span class="token">+</span>
            <span class="token">@ src/greet.ts</span>
            <span class="token">medium</span>
            <span class="grow"></span>
            <span>32% · 4.7s</span>
            <span class="send" aria-hidden="true"></span>
          </div>
        </div>
      </section>
      <aside class="inspect" id="inspect"></aside>
    </div>

    <template id="tpl-next">
      <button type="button" class="region user" data-key="prompt">把 greet 改成支持可选 lastName，并跑测试</button>
      <details class="region think" data-key="thinking" open>
        <summary><span class="dot"></span> 想了 6 秒</summary>
        <ol>
          <li>现有签名只收 name，先读文件确认测试怎么断言</li>
          <li>补可选 lastName，保持旧调用还能过</li>
          <li>跑项目测试，不要只写新用例</li>
        </ol>
      </details>
      <button type="button" class="region chips" data-key="tools" id="chips">
        <div class="chip-row"><strong>Read</strong><span class="pill">src/greet.ts</span></div>
        <div class="chip-row"><strong>Edit</strong><span class="pill">src/greet.ts <span class="add">+12</span> <span class="del">−4</span></span></div>
        <div class="chip-row"><strong>bash</strong><span class="pill">npm test</span></div>
        <pre class="chip-detail">$ npm test
 PASS  src/greet.test.ts</pre>
      </button>
      <button type="button" class="region approve" data-key="approval">
        <div class="kicker">等待决定</div>
        <h4>允许运行 npm test</h4>
        <p>Agent 已暂停。允许这一次只执行当前命令；本对话始终允许后，同类命令不再询问。</p>
        <pre>bash · npm test</pre>
        <div class="actions">
          <span>拒绝</span>
          <span>允许这一次</span>
          <span class="primary">本对话始终允许</span>
        </div>
      </button>
      <button type="button" class="region answer" data-key="answer">
        已把 lastName 做成可选参数，旧的 greet(name) 仍然返回原来的句子。测试通过。
        <pre>export function greet(name: string, lastName?: string) {
  return lastName ? `hello ${name} ${lastName}` : `hello ${name}`;
}</pre>
        <div class="sources">
          <span class="source">vitest.dev</span>
          <span class="source">src/greet.test.ts</span>
        </div>
      </button>
      <button type="button" class="region compact" data-key="compact">
        已整理上下文 · 保留 greet.ts 与测试文件 · 摘要了 18 条旧消息
      </button>
    </template>

    <template id="tpl-now">
      <button type="button" class="region user" data-key="prompt">
        <span class="who">YOU</span>
        把 greet 改成支持可选 lastName，并跑测试
      </button>
      <p class="missing region" data-key="thinking">思考块未投影。Pi 发了 thinking_delta，桥只转发 text_delta。</p>
      <details class="region tool" data-key="tools" open>
        <summary>编辑 src/greet.ts · 运行 $ npm test</summary>
        <pre class="now-pre">src/greet.ts

$ npm test

PASS src/greet.test.ts</pre>
      </details>
      <button type="button" class="region notice" data-key="approval">
        <span class="code">ASK<br />批准</span>
        <div>
          <strong>请求批准 · bash</strong>
          <p>Agent 已暂停。允许这一次只执行当前操作；本对话始终允许后，同类操作不再询问。</p>
          <p>HOLD 等待决定</p>
        </div>
      </button>
      <div class="region bubble" data-key="answer">
        <span class="who">MILKSU</span>
        已把 lastName 做成可选参数。测试通过。
        <p class="missing" style="margin:0.45rem 0 0">来源和代码复制条未从工具结果提起。</p>
      </div>
      <p class="missing region" data-key="compact">压缩进行时只有「正在整理上下文」，没有保留了哪些文件。</p>
    </template>

    <script>
      const facts = {
        prompt: {
          title: "用户消息",
          pi: "UserMessage 文本 + 附件。TUI 还能 @ 文件、粘贴图片、!command。",
          now: "气泡 + 附件芯片。没有 @ 项目文件模糊查找。",
          next: "形态可更轻；职责不变。",
        },
        thinking: {
          title: "Thinking",
          pi: "助手 content 的 type: thinking；流式 thinking_start / thinking_delta / thinking_end。TUI 可 Ctrl+T 折叠。压缩时写成 [Assistant thinking]。",
          now: "bridge.js 的 message_update 只转发 text_delta。textContent() 丢掉 thinking 块。成绩单上看不见「想了 Ns」。档位滑块只改请求。",
          next: "可展开「想了 Ns」。正文必须来自 Pi，不演假步骤。",
        },
        tools: {
          title: "Tool Chips",
          pi: "tool_execution_start / update / end。edit / write / bash / read 的 args 与 result 都在。",
          now: "ChatActivityGroup 用 details + pre 整段倾倒。formatToolInput 对 edit/write 只留路径，没有 +N / −N。",
          next: "一行摘要 + 文件芯片，点开才看原文。",
        },
        approval: {
          title: "Approval Card",
          pi: "MilkSU 审批 broker，once / conversation，grantable。",
          now: "ak-notice + HOLD / OK / STOP。语义对，形态是设置通知。",
          next: "同一三个按钮，卡片按人机确认来排。",
        },
        answer: {
          title: "Streaming Text / CodeBlock",
          pi: "text_delta 已投影。web_search / web_fetch 结果在工具输出里。",
          now: "Markdown 一次进气泡。来源埋在工具 pre。代码块没有复制条。",
          next: "回答下沿用来源芯片（只接线真实工具结果）+ 代码块壳。",
        },
        compact: {
          title: "压缩横幅",
          pi: "compaction_start / end；准备阶段有 fileOps、read-files、modified-files。",
          now: "一条「正在整理上下文」。不展示摘要，也不展示保留了哪些文件。",
          next: "压缩结束后的横幅：整理了多少旧消息、留下哪些文件。",
        },
        composer: {
          title: "Prompt Bar",
          pi: "TUI：@ 文件、/ 命令、Shift+Tab 思考档、Enter 转向、Alt+Enter 追问、页脚 usage/cost。",
          now: "slash、附件、模型、思考档、steer 队列、上下文环已经有。缺 @ 文件模糊查找、思考档边框色、cost。",
          next: "岛状密度。不要彩虹扫光，不要 Figma/Slack 连接器。",
        },
      };

      const col = document.getElementById("col");
      const inspect = document.getElementById("inspect");
      const btnNow = document.getElementById("btn-now");
      const btnNext = document.getElementById("btn-next");
      let mode = "next";
      let current = "thinking";

      function renderInspect(key) {
        const item = facts[key] || facts.thinking;
        inspect.innerHTML =
          "<h2>接到 Pi</h2><h3>" + item.title + "</h3>" +
          "<p><strong>Pi 已有</strong> " + item.pi + "</p>" +
          "<p><strong>现在成绩单</strong> " + item.now + "</p>" +
          "<p><strong>重构后</strong> " + item.next + "</p>" +
          "<h3>不要从这张图库发明</h3><ul>" +
          "<li>假置信度 Recommendation Card</li>" +
          "<li>CRM Records 表</li>" +
          "<li>会话树 /tree /fork（Pi 有，本预览不做）</li>" +
          "<li>付费 Central Icons、React、整份 globals.css</li></ul>";
      }

      function bindRegions() {
        col.querySelectorAll(".region").forEach((el) => {
          el.addEventListener("click", () => {
            const key = el.getAttribute("data-key");
            if (key === "tools" && el.classList.contains("chips")) el.classList.toggle("is-open");
            current = key;
            col.querySelectorAll(".region").forEach((node) => node.classList.remove("is-on"));
            document.getElementById("composer").classList.remove("is-on");
            el.classList.add("is-on");
            renderInspect(key);
          });
        });
      }

      function setMode(nextMode) {
        mode = nextMode;
        document.body.classList.toggle("now", mode === "now");
        btnNow.setAttribute("aria-pressed", String(mode === "now"));
        btnNext.setAttribute("aria-pressed", String(mode === "next"));
        const tpl = document.getElementById(mode === "now" ? "tpl-now" : "tpl-next");
        col.replaceChildren(tpl.content.cloneNode(true));
        bindRegions();
        const node = col.querySelector('[data-key="' + current + '"]') || col.querySelector("[data-key]");
        if (node) {
          current = node.getAttribute("data-key") || current;
          node.classList.add("is-on");
        }
        renderInspect(current);
      }

      document.getElementById("composer").addEventListener("click", () => {
        current = "composer";
        col.querySelectorAll(".region").forEach((node) => node.classList.remove("is-on"));
        document.getElementById("composer").classList.add("is-on");
        renderInspect("composer");
      });
      btnNow.addEventListener("click", () => setMode("now"));
      btnNext.addEventListener("click", () => setMode("next"));
      setMode(new URLSearchParams(location.search).get("view") === "now" ? "now" : "next");
    </script>
  </body>
</html>
