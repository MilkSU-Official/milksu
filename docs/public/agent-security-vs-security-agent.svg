<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agent Security 与 Agent for Security 的二轴分类</title>
  <desc id="desc">横轴区分通用任务和安全任务，纵轴表示 Agent 自身需要的安全加固程度。任务类型与运行防护是正交关系：普通浏览或邮件 Agent 也可能需要强安全加固，隔离 CTF 或本地 AppSec Agent 则可以执行安全任务但面对较低的外部渗透风险。</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" class="axis-head"/>
    </marker>
    <style>
      text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #1f2937;
      }
      .muted { fill: #6b7280; }
      .grid-line {
        stroke: #9ca3af;
        stroke-width: 2;
      }
      .axis-line {
        stroke: #4b5563;
        stroke-width: 2.5;
        fill: none;
      }
      .axis-head { fill: #4b5563; }
      .cell-general { fill: #3b82f612; }
      .cell-security-task { fill: #f9731612; }
      .cell-hardened { fill: #8b5cf61a; }
      .cell-both { fill: #22c55e1c; }
      .cell-border {
        stroke: #d1d5db;
        stroke-width: 1.5;
      }
      .cell-title {
        font-size: 24px;
        font-weight: 600;
      }
      .cell-detail { font-size: 17px; }
      .axis-title {
        font-size: 20px;
        font-weight: 600;
      }
      .axis-end { font-size: 16px; }
      .tag {
        font-size: 15px;
        font-weight: 600;
      }
      .tag-bg-general { fill: #3b82f62b; }
      .tag-bg-security { fill: #f973162b; }
      .tag-bg-integrity { fill: #8b5cf62b; }
      .tag-bg-both { fill: #22c55e2b; }
      @media (prefers-color-scheme: dark) {
        text { fill: #f3f4f6; }
        .muted { fill: #a7adb7; }
        .grid-line { stroke: #6b7280; }
        .axis-line { stroke: #d1d5db; }
        .axis-head { fill: #d1d5db; }
        .cell-border { stroke: #4b5563; }
        .cell-general { fill: #10233f; }
        .cell-security-task { fill: #382113; }
        .cell-hardened { fill: #2f2349; }
        .cell-both { fill: #173620; }
        .tag-bg-general { fill: #1d4f91; }
        .tag-bg-security { fill: #8a3d13; }
        .tag-bg-integrity { fill: #583c91; }
        .tag-bg-both { fill: #1e6b36; }
      }
    </style>
  </defs>

  <rect class="cell-general cell-border" x="190" y="385" width="430" height="250" rx="14"/>
  <rect class="cell-security-task cell-border" x="620" y="385" width="430" height="250" rx="14"/>
  <rect class="cell-hardened cell-border" x="190" y="135" width="430" height="250" rx="14"/>
  <rect class="cell-both cell-border" x="620" y="135" width="430" height="250" rx="14"/>

  <line class="grid-line" x1="620" y1="135" x2="620" y2="635"/>
  <line class="grid-line" x1="190" y1="385" x2="1050" y2="385"/>
  <path class="axis-line" d="M190 665 L1080 665" marker-end="url(#axis-arrow)"/>
  <path class="axis-line" d="M160 635 L160 105" marker-end="url(#axis-arrow)"/>

  <rect class="tag-bg-integrity" x="225" y="165" width="142" height="30" rx="15"/>
  <text class="tag" x="242" y="186">Agent Security</text>
  <text class="cell-title" x="225" y="235">高权限通用 Agent</text>
  <text class="cell-detail" x="225" y="275">浏览、邮件、办公、代码检索</text>
  <text class="cell-detail" x="225" y="309">任务不是安全任务，但外部内容</text>
  <text class="cell-detail" x="225" y="339">仍可能触发注入、投毒或数据外传</text>

  <rect class="tag-bg-both" x="655" y="165" width="210" height="30" rx="15"/>
  <text class="tag" x="672" y="186">两种问题同时存在</text>
  <text class="cell-title" x="655" y="235">在线安全角色 Agent</text>
  <text class="cell-detail" x="655" y="275">在线红队、蓝队、恶意样本分析</text>
  <text class="cell-detail" x="655" y="309">既需要角色状态与 evaluator，</text>
  <text class="cell-detail" x="655" y="339">也可能需要完整性、隔离和权限防护</text>

  <rect class="tag-bg-general" x="225" y="415" width="118" height="30" rx="15"/>
  <text class="tag" x="242" y="436">通用任务</text>
  <text class="cell-title" x="225" y="485">普通开发 Agent</text>
  <text class="cell-detail" x="225" y="525">架构、实现、测试、调试</text>
  <text class="cell-detail" x="225" y="559">按工具权限和数据敏感度决定</text>
  <text class="cell-detail" x="225" y="593">所需防护，不由任务名称决定</text>

  <rect class="tag-bg-security" x="655" y="415" width="190" height="30" rx="15"/>
  <text class="tag" x="672" y="436">Agent for Security</text>
  <text class="cell-title" x="655" y="485">隔离安全任务 Agent</text>
  <text class="cell-detail" x="655" y="525">普通 CTF、本地 AppSec、靶场实验</text>
  <text class="cell-detail" x="655" y="559">正在做安全任务，不等于外部攻击者</text>
  <text class="cell-detail" x="655" y="593">正在尝试渗透这个 Agent</text>

  <text class="axis-title" x="510" y="720">任务语义</text>
  <text class="axis-end muted" x="190" y="695">通用任务</text>
  <text class="axis-end muted" x="970" y="695">安全任务</text>

  <text class="axis-title" x="28" y="405" transform="rotate(-90 28 405)">Agent 自身所需的安全加固</text>
  <text class="axis-end muted" x="78" y="630" transform="rotate(-90 78 630)">较低</text>
  <text class="axis-end muted" x="78" y="188" transform="rotate(-90 78 188)">较高</text>
</svg>
