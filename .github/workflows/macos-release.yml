name: macOS signed release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full verified main commit to package
        required: true
        type: string
      upload_release:
        description: Upload verified artifacts to private R2 and create an Admin draft
        required: true
        type: boolean
        default: false
      use_self_hosted:
        description: Run the signed release on a registered private macOS runner
        required: true
        type: boolean
        default: false
      release_title:
        description: Release title shown in MilkSU
        required: true
        type: string
        default: MilkSU update
      release_notes:
        description: Short release notes shown before download
        required: true
        type: string
        default: A new signed MilkSU version is available.
      minimum_version:
        description: Oldest version allowed to install this update
        required: true
        type: string
        default: 0.1.0

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ inputs.use_self_hosted && fromJSON('["self-hosted","macOS","ARM64"]') || fromJSON('["macos-15"]') }}
    timeout-minutes: 180
    environment: macos-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Select the immutable release source
        env:
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          source_commit="$(printf '%s' "$RELEASE_SOURCE_COMMIT" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'source_commit must be a full Git commit' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$source_commit" origin/main
          git checkout -B main "$source_commit"
          git submodule update --init --recursive
          test -z "$(git status --porcelain)"
      - name: Refuse a Stable release outside main
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Set up Node with hosted cache
        if: ${{ !inputs.use_self_hosted }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Node without remote cache
        if: ${{ inputs.use_self_hosted }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up Go with hosted cache
        if: ${{ !inputs.use_self_hosted }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Go without remote cache
        if: ${{ inputs.use_self_hosted }}
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix app ci
          npm --prefix desktop ci
      - name: Import Developer ID certificate into an ephemeral Keychain
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/milksu-signing.keychain-db"
          certificate="$RUNNER_TEMP/milksu-developer-id.p12"
          keychain_password="$(openssl rand -hex 24)"
          echo "MILKSU_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          if ! printf '%s' "$MACOS_CSC_LINK" | base64 --decode > "$certificate" 2>/dev/null; then
            printf '%s' "$MACOS_CSC_LINK" | base64 -D > "$certificate"
          fi
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          existing_keychains=()
          while IFS= read -r keychain_path; do
            [[ -n "$keychain_path" ]] && existing_keychains+=("$keychain_path")
          done < <(security list-keychains -d user | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          rm -f "$certificate"
      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
          if ! printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key" 2>/dev/null; then
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key"
          fi
          chmod 600 "$key"
      - name: Build, sign, notarize and verify
        env:
          MILKSU_CODESIGN_IDENTITY: ${{ secrets.MILKSU_CODESIGN_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MILKSU_ACCOUNT_API_URL: https://accounts.milksu.org
          MILKSU_RELEASE_TITLE: ${{ inputs.release_title }}
          MILKSU_RELEASE_NOTES: ${{ inputs.release_notes }}
          MILKSU_MINIMUM_UPDATE_VERSION: ${{ inputs.minimum_version }}
          MILKSU_BUILD_OTA: ${{ inputs.upload_release && '1' || '0' }}
        run: npm run desktop:release:mac
      - uses: actions/upload-artifact@v4
        with:
          name: MilkSU-macOS-arm64-installer
          path: build/release/MilkSU-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Install R2 uploader
        if: ${{ inputs.upload_release }}
        run: brew install rclone
      - name: Upload verified release and create Admin draft
        if: ${{ inputs.upload_release }}
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          MILKSU_R2_BUCKET: milksu-releases
          MILKSU_RELEASE_API_URL: https://accounts.milksu.org
          MILKSU_RELEASE_PUBLISH_TOKEN: ${{ secrets.MILKSU_RELEASE_PUBLISH_TOKEN }}
        run: node scripts/publish-release.mjs
      - name: Remove temporary signing assets
        if: always()
        run: |
          rm -f "${APPLE_API_KEY_PATH:-}"
          if [[ -n "${MILKSU_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$MILKSU_SIGNING_KEYCHAIN" || true
          fi
