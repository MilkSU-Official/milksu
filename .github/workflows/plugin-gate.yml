name: Plugin ecosystem v1 gate

on:
  pull_request:
    paths:
      - '.github/workflows/plugin-gate.yml'
      - 'app/public/plugin-frame-bootstrap.js'
      - 'app/src/**'
      - 'desktop/**'
      - 'docs/developer/plugin-**'
      - 'runtime/src/plugin/**'
      - 'runtime/src/plugin-mcp.ts'
      - 'runtime/src/pluginctl.ts'
      - 'package-lock.json'
      - 'package.json'
      - 'plugins/**'
      - 'scripts/build-plugins.mjs'
      - 'scripts/plugin-tools.mjs'
      - 'scripts/test-plugin-author-flow.mjs'
      - 'sidecar/plugin-runtime/**'
      - 'sidecar/pi/bridge-plugin-mcp*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/plugin-gate.yml'
      - 'app/public/plugin-frame-bootstrap.js'
      - 'app/src/**'
      - 'desktop/**'
      - 'runtime/src/plugin/**'
      - 'runtime/src/plugin-mcp.ts'
      - 'runtime/src/pluginctl.ts'
      - 'package-lock.json'
      - 'package.json'
      - 'plugins/**'
      - 'scripts/build-plugins.mjs'
      - 'scripts/plugin-tools.mjs'
      - 'scripts/test-plugin-author-flow.mjs'
      - 'sidecar/plugin-runtime/**'
      - 'sidecar/pi/bridge-plugin-mcp*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-v1:
    name: ${{ matrix.os }} plugin v1
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install plugin gate dependencies
        run: |
          npm ci
          npm --prefix app ci
      - name: Validate generated official plugins
        run: npm run plugins:check
      - name: Exercise package, trust, storage, runtime and MCP contracts
        run: |
          npm run runtime:test
          npm run test:plugin-author
          node --test sidecar/plugin-runtime/*.test.mjs sidecar/pi/bridge-plugin-mcp.test.js desktop/backend-runtime.test.cjs desktop/desktop-rpc-source.test.cjs desktop/renderer-protocol.test.cjs desktop/startup-environment.test.cjs
      - name: Validate renderer plugin contracts
        run: |
          npm --prefix app test -- --run src/lib/pluginFrame.test.ts src/lib/pluginThemeBridgeContract.test.ts
          npm --prefix app run build
