name: Windows startup without Git

on:
  pull_request:
    paths:
      - '.github/workflows/windows-startup.yml'
      - '.github/workflows/windows-release.yml'
      - 'desktop/**'
      - 'runtime/**'
      - 'scripts/build-windows-cua-driver.mjs'
      - 'scripts/package-sidecar.mjs'
      - 'sidecar/computer-use/**'
      - 'third_party/cua-driver/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-startup-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/cache@v4
        with:
          path: build/sidecar-cache
          key: sidecar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/package-sidecar.mjs', 'scripts/build-windows-cua-driver.mjs', 'package-lock.json') }}
          restore-keys: |
            sidecar-${{ runner.os }}-${{ runner.arch }}-
      - name: Install workspace dependencies
        shell: pwsh
        run: npm ci
      - name: Verify the private Electron probe environment
        shell: pwsh
        run: node --test --test-isolation=none desktop/startup-environment.test.cjs desktop/package-files.test.cjs
      - name: Run TypeScript Runtime suites
        shell: pwsh
        run: npm run runtime:test
      - name: Build and verify the pinned Windows Cua Driver
        shell: pwsh
        run: node scripts/build-windows-cua-driver.mjs verify
      - name: Probe the Windows Computer Use host boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:MILKSU_TEST_CUA_DRIVER = (Resolve-Path 'build/sidecar-cache/cua-windows-0.29.1/r/cua-driver.exe').Path
          node --test --experimental-strip-types --test-concurrency=1 runtime/src/computercap.test.ts
          node --test sidecar/computer-use/computer-use-proxy.test.js
