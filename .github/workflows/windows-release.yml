name: Windows x64 release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full verified main commit to package with this workflow revision
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Select the immutable release source
        shell: pwsh
        env:
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = $env:RELEASE_SOURCE_COMMIT.Trim().ToLowerInvariant()
          if ($source -notmatch '^[0-9a-f]{40}$') {
            throw "source_commit must be a full Git commit"
          }
          git merge-base --is-ancestor $source origin/main
          if ($LASTEXITCODE -ne 0) { throw "source_commit is not on main" }
          git checkout -B main $source
          git submodule update --init --recursive
          if ((git status --porcelain)) { throw "selected release source is dirty" }
      - name: Refuse a Stable release outside main
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Stable release must run from main, got $env:GITHUB_REF"
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          npm --prefix app ci
          npm --prefix desktop ci
      - name: Validate the Windows build boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # The canonical full suite is already bound to this commit by the
          # local release receipt. Windows compiles every Go package/test, then
          # exercises the routed model regression with native paths before
          # packaging and first launch.
          go test ./... -run '^$'
          go test ./cmd/milksu-backend -run '^TestWindowsStartupDoesNotRequireGit$' -count=1
          node --test --test-isolation=none desktop/startup-environment.test.cjs desktop/package-files.test.cjs
          node --test sidecar/pi/current-provider-runtime.test.js sidecar/pi/model-source-routing.test.js
      - name: Build Windows installer
        shell: pwsh
        env:
          MILKSU_ACCOUNT_API_URL: https://accounts.milksu.org
        run: npm run desktop:release:windows
      - name: Verify packaged runtimes and first launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $installer = "build/release/MilkSU-Windows-x64-$version-Setup.exe"
          if (-not (Test-Path $installer)) { throw "missing installer: $installer" }
          $builderConfig = Get-Content 'build/desktop/electron-builder.stable.windows.json' | ConvertFrom-Json
          if ($builderConfig.nsis.oneClick -ne $false) { throw 'installer must use the assisted setup wizard' }
          if ($builderConfig.nsis.allowToChangeInstallationDirectory -ne $true) { throw 'installer must expose the installation directory' }
          if ($builderConfig.nsis.createDesktopShortcut -ne 'always') { throw 'installer must offer a persistent desktop shortcut' }
          if ($builderConfig.nsis.createStartMenuShortcut -ne $true) { throw 'installer must create a Start menu shortcut' }
          if ($builderConfig.nsis.runAfterFinish -ne $true) { throw 'installer must expose launch on the completion page' }
          $digest = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          Write-Host "installer_sha256=$digest"

          $node = 'build/sidecar/windows-amd64/node.exe'
          $nodeVersion = (& $node --version).Trim()
          if ($nodeVersion -ne 'v24.18.0') { throw "unexpected Node runtime: $nodeVersion" }

          $backend = 'build/desktop/milksu-backend.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'milksu-backend.stdout'
          $stderr = Join-Path $env:RUNNER_TEMP 'milksu-backend.stderr'
          $backendProcess = Start-Process -FilePath $backend -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $stdout) {
                $ready = (Get-Content $stdout -Raw) -match '"type"\s*:\s*"ready"'
              }
              if ($ready) { break }
              if ($backendProcess.HasExited) { break }
            }
            if (-not $ready) {
              $safeError = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
              throw "backend did not publish ready: $safeError"
            }
          } finally {
            if (-not $backendProcess.HasExited) { Stop-Process -Id $backendProcess.Id -Force }
          }

          $appPath = (Resolve-Path 'build/electron/windows/stable/win-unpacked/MilkSU.exe').Path
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'milksu-no-git-smoke'
          $smokeProfile = Join-Path $smokeRoot 'profile'
          $smokeAppData = Join-Path $smokeProfile 'AppData\Roaming'
          $smokeLocalAppData = Join-Path $smokeProfile 'AppData\Local'
          $smokeTemp = Join-Path $smokeLocalAppData 'Temp'
          $smokeData = Join-Path $smokeRoot 'milksu-data'
          $smokeArtifacts = Join-Path $smokeRoot 'milksu-artifacts'
          New-Item -ItemType Directory -Force -Path `
            $smokeAppData, $smokeLocalAppData, $smokeProfile, $smokeTemp, `
            $smokeData, $smokeArtifacts | Out-Null

          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $appPath
          $startInfo.WorkingDirectory = Split-Path -Parent $appPath
          $startInfo.UseShellExecute = $false
          # Model a blank user without copying job credentials or tool paths.
          $startInfo.Environment.Clear()
          $startInfo.Environment['SystemRoot'] = $env:SystemRoot
          $startInfo.Environment['WINDIR'] = $env:WINDIR
          $startInfo.Environment['ComSpec'] = $env:ComSpec
          $startInfo.Environment['PATH'] = ''
          $startInfo.Environment['APPDATA'] = $smokeAppData
          $startInfo.Environment['LOCALAPPDATA'] = $smokeLocalAppData
          $startInfo.Environment['USERPROFILE'] = $smokeProfile
          $startInfo.Environment['HOME'] = $smokeProfile
          $startInfo.Environment['HOMEDRIVE'] = (Split-Path -Qualifier $smokeProfile)
          $startInfo.Environment['HOMEPATH'] = $smokeProfile.Substring(2)
          $startInfo.Environment['TEMP'] = $smokeTemp
          $startInfo.Environment['TMP'] = $smokeTemp
          $startInfo.Environment['MILKSU_APPDATA_DIR'] = $smokeData
          $startInfo.Environment['MILKSU_USER_ARTIFACTS_DIR'] = $smokeArtifacts
          $startInfo.Environment['MILKSU_INSTANCE_ID'] = 'windows-release-no-git-smoke'

          $appProcess = [System.Diagnostics.Process]::new()
          $appProcess.StartInfo = $startInfo
          if (-not $appProcess.Start()) { throw 'packaged MilkSU did not start' }
          try {
            $startupReady = $false
            $backendChildren = @()
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while ([DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $appProcess.Refresh()
              if ($appProcess.HasExited) {
                throw "packaged MilkSU exited during no-Git startup ($($appProcess.ExitCode))"
              }
              $backendChildren = @(
                Get-CimInstance Win32_Process -Filter "Name = 'milksu-backend.exe'" |
                  Where-Object { $_.ParentProcessId -eq $appProcess.Id }
              )
              $windowReady = $appProcess.MainWindowHandle -ne 0 -and
                $appProcess.MainWindowTitle -eq 'MilkSU'
              if ($windowReady -and $backendChildren.Count -gt 0) {
                $startupReady = $true
                break
              }
            }
            if (-not $startupReady) {
              throw "packaged MilkSU did not expose its main window and owned Go runtime within 60 seconds (title=$($appProcess.MainWindowTitle), backend_count=$($backendChildren.Count))"
            }
          } finally {
            $ownedChildProcesses = @(
              Get-CimInstance Win32_Process |
                Where-Object { $_.ParentProcessId -eq $appProcess.Id }
            )
            $treeRoots = if ($appProcess.HasExited) {
              @($ownedChildProcesses | ForEach-Object { $_.ProcessId })
            } else {
              @($appProcess.Id)
            }
            $taskkill = Join-Path $env:SystemRoot 'System32\taskkill.exe'
            foreach ($treeRoot in $treeRoots) {
              & $taskkill /PID $treeRoot /T /F 2>$null | Out-Null
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MilkSU-Windows-x64-installer
          path: build/release/MilkSU-Windows-x64-*-Setup.exe
          if-no-files-found: error
          retention-days: 14
