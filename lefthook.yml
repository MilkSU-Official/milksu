# Local pre-commit hooks: gofmt check and tests for changed Go packages.
# lefthook installs these into .git/hooks on `npm install` (via `prepare`).
pre-commit:
  commands:
    gofmt:
      glob: '*.go'
      run: |
        export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/local/go/bin:/usr/bin:/c/Program Files/Go/bin:/c/Go/bin:$PATH"
        if ! command -v gofmt >/dev/null 2>&1; then
          echo 'gofmt not found. Please install Go or ensure gofmt is in PATH.' >&2
          exit 1
        fi
        unformatted=$(gofmt -l {staged_files})
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          echo 'Staged Go files are not gofmt-clean.'
          exit 1
        fi
    go-test:
      glob: '*.go'
      run: |
        export PATH="/opt/homebrew/bin:/usr/local/bin:/usr/local/go/bin:/usr/bin:/c/Program Files/Go/bin:/c/Go/bin:$PATH"
        ./scripts/go-test-staged.sh {staged_files}
