<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root { color-scheme: dark; }
      body { box-sizing: border-box; width: 340px; margin: 0; padding: 18px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; color: #f4f4f4; background: #101927; }
      .eyebrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; color: #8799b5; font-size: 11px; }
      .bridge-state { display: inline-flex; align-items: center; gap: 6px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #8799b5; }
      .dot.online { background: #9fef00; box-shadow: 0 0 0 3px rgb(159 239 0 / 12%); }
      h1 { margin: 0 0 5px; font-size: 17px; line-height: 1.3; }
      p { margin: 0 0 14px; color: #8799b5; }
      .pairing-help { margin: 8px 0 0; font-size: 11px; line-height: 1.45; }
      details { margin-top: 14px; border-top: 1px solid #212c3c; padding-top: 12px; }
      summary { color: #8799b5; cursor: pointer; font-size: 11px; }
      label { display: block; margin-top: 10px; font-size: 11px; font-weight: 650; }
      textarea { box-sizing: border-box; width: 100%; height: 68px; margin-top: 5px; padding: 9px; resize: none; border: 1px solid #344158; border-radius: 8px; outline: none; color: #f4f4f4; background: #151f2e; font: 11px/1.35 ui-monospace, monospace; }
      textarea:focus { border-color: #9fef00; }
      button { width: 100%; margin-top: 14px; padding: 10px; border: 0; border-radius: 8px; color: #101927; background: #9fef00; font-weight: 700; cursor: pointer; }
      button:hover { background: #b5f542; }
      #status { min-height: 38px; margin-top: 10px; color: #8799b5; font-size: 12px; }
      #status.success { color: #c8ff5b; }
      #status.error { color: #ff8f89; }
    </style>
  </head>
  <body>
    <div class="eyebrow">
      <span>MilkSU Bridge</span>
      <span class="bridge-state"><span id="connection-dot" class="dot"></span><span id="connection-label">检查中</span></span>
    </div>
    <h1 id="title">连接当前 CTF 页面</h1>
    <p id="description">只读取你主动连接的当前标签页；不会发送 Cookie、密码或浏览历史。</p>
    <details id="pairing-settings">
      <summary>首次配对或更换 MilkSU</summary>
      <label>配对码<textarea id="pairing" placeholder="MilkSU → CTF → 连接浏览器 → 复制配对码"></textarea></label>
      <p class="pairing-help">配对码在 MilkSU 的 CTF 顶栏“连接浏览器”里；那里会直接显示并支持复制。</p>
    </details>
    <button id="connect">连接到 MilkSU</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
