services:
  webgoat:
    image: webgoat/webgoat:v2025.3@sha256:3101bd9e7bcfe122d7ef91e690ef3720de36cc4e86b3d06763a1ddf2e2751a4b
    init: true
    restart: "no"
    environment:
      TZ: UTC
    ports:
      - "127.0.0.1:${MILKSU_CTF_PORT:-3000}:8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 384
    mem_limit: 1536m
    cpus: 2
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --output-document=- http://127.0.0.1:8080/WebGoat/actuator/health | grep --quiet '"status":"UP"'
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 30s
    networks:
      - lab

networks:
  lab:
    driver: bridge
    internal: true
