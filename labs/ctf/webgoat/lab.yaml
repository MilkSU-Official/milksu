apiVersion: labs.milksu.dev/v1alpha1
kind: LabPackage
metadata:
  id: owasp.webgoat
  title: OWASP WebGoat
  version: v2025.3
  license: GPL-2.0-or-later
  source:
    url: https://github.com/WebGoat/WebGoat
    revision: c3ed45a733377bc7313b93f57ff518254d81380f
    image: webgoat/webgoat:v2025.3
    digest: sha256:3101bd9e7bcfe122d7ef91e690ef3720de36cc4e86b3d06763a1ddf2e2751a4b
spec:
  role: ctf
  categories: [web]
  learning:
    objectives:
      - Complete WebGoat's SQL Injection introduction and obtain all nine application-verified assignment receipts.
  runtime:
    provider: compose
    entry: compose.yaml
    platforms: [linux/arm64, linux/amd64]
    endpoints:
      - name: web
        service: webgoat
        targetPort: 8080
        protocol: http
        publish: loopback-ephemeral
        launchPath: "/WebGoat/attack#lesson/SqlInjection.lesson"
    network:
      ingress: loopback
      egress: deny
  access:
    type: form
    loginPath: /WebGoat/login
    stateFile: access.json
  readiness:
    - type: http
      endpoint: web
      path: /WebGoat/actuator/health
      timeout: 240s
  reset:
    strategy: recreate-with-volumes
  judge:
    type: application-oracle
    challenge: SqlInjection
    endpoint: /WebGoat/service/lessonoverview.mvc/SqlInjection.lesson
    responseContract: json-assignment-set
    expectedAssignments:
      - SqlInjectionLesson2
      - SqlInjectionLesson3
      - SqlInjectionLesson4
      - SqlInjectionLesson5
      - SqlInjectionLesson5a
      - SqlInjectionLesson5b
      - SqlInjectionLesson8
      - SqlInjectionLesson9
      - SqlInjectionLesson10
  security:
    privileged: false
    hostNetwork: false
    dockerSocket: false
    hostMounts: []
